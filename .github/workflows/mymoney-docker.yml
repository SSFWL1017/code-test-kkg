
name: MyMoney Docker CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'mymoney/**'
      - '.github/workflows/mymoney-docker.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./mymoney
          push: true
          tags: |
            ssfwl1017/mymoney:latest
            ssfwl1017/mymoney:${{ github.sha }}

      - name: Update Kubernetes Deployment Image
        run: |
          sed -i "s|image: ssfwl1017/mymoney:.*|image: ssfwl1017/mymoney:${GITHUB_SHA}|" k8s/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update MyMoney image to ${GITHUB_SHA}"
            git push origin HEAD:main
          fi
