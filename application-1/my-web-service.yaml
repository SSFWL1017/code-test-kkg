apiVersion: apps/v1
kind: Devployment

metadata:
  name: my-web-page
  namespace: jhchun

spec:
  replicas: 3

  selector:
    matchLabels:
      app: my-web-page

  template:
    metadata:
      labels:
        app: my-web-page

    spec:
      containers:
        - name: my-apache2
          image: chunjihu/ubuntu24.04:my-apache2
